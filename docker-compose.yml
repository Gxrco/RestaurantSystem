services:
  # ─────────────────────────── Base de datos ───────────────────────────
  db:
    build:
      context: "./SQL DB"
    container_name: restaurant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-restaurante}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # El SQL se copia en la imagen desde SQL DB/Dockerfile para que una base
      # nueva se inicialice sin depender de bind mounts del host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-restaurante}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ──────────────────────────── Backend API ────────────────────────────
  server:
    build:
      context: ./Server
    container_name: restaurant_server
    restart: unless-stopped
    environment:
      PORT: 3002
      HOST: 0.0.0.0
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-restaurante}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
    ports:
      - "${SERVER_PORT:-3002}:3002"
    depends_on:
      db:
        condition: service_healthy
    # Sin bind mount ./Server:/app (llega vacío en E: con WSL2). El código va
    # dentro de la imagen; para cambios: docker compose up --build -d
    volumes:
      - /app/node_modules

  # ─────────────────────────── Frontend (Vite) ─────────────────────────
  client:
    build:
      context: ./Client
    container_name: restaurant_client
    restart: unless-stopped
    environment:
      # URL que usa el navegador del host para hablarle al backend
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3002}
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      - server
    # Sin bind mount ./Client:/app (llega vacío en E: con WSL2). El código va
    # dentro de la imagen; para cambios: docker compose up --build -d
    volumes:
      - /app/node_modules

volumes:
  db_data:
